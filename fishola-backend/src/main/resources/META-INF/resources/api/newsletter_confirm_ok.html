<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="stylesheet" href="carnet.css">
    <title>Inscription confirmée - Carnet de pêche</title>

<body>
    <main class="carnet-page">
        <div class="carnet-title">
            <div class="carnet-welcome">Bienvenue sur</div>
            <div class="carnet-logo-tile">
                <img src="logo-carnet-light.svg" alt="Carnet de pêche" />
            </div>
        </div>
        <section class="carnet-panel">
            <div class="carnet-status success" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
            </div>
            <h1 class="carnet-heading">Inscription confirmée</h1>
            <p>Votre inscription à la newsletter Carnet de pêche est confirmée.</p>
            <p>Nous vous préviendrons dès l'ouverture de l'application.</p>
        </section>
    </main>
